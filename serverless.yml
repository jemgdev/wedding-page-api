service: wedding-page-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region}
  environment:
    STAGE: ${opt:stage}
    REGION: ${opt:region}

package:
  individually: true
  patterns:
    - dist/**
    - node_modules/**
    - package.json
    - '!.github/**'
    - '!src/**'
    - '!test/**'
    - '!.git/**'
    - '!*.md'
    - '!.vscode/**'
    - '!tsconfig.json'
    - '!jest.config.js'
    - '!LICENSE'

plugins:
  - serverless-offline

resources:
  Resources:
    GetCommentsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: get-comments-role-${opt:stage}
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: get-comments-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - arn:aws:dynamodb:${opt:region}:*:table/wedding-page-api-comments-table-${opt:stage}

  CommentsDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # 1. Nombre de la Tabla
      TableName: wedding-page-api-comments-table-${opt:stage}
      
      # 2. DEFINICIÓN DE ATRIBUTOS: (TODOS los atributos usados en KeySchema e Índices)
      AttributeDefinitions:
        # HASH Key (Identificador del comentario o, mejor aún, del recurso comentado)
        - AttributeName: id
          AttributeType: S 
        # RANGE Key (Necesario para ordenar los comentarios por fecha)
        - AttributeName: createdAt
          AttributeType: S # Usamos String (ISO 8601) o N (Number) para la fecha
          
      # 3. ESQUEMA DE CLAVE: (Define la Clave Primaria)
      KeySchema:
        - AttributeName: id
          KeyType: HASH # Partition Key (Clave de Partición)
        - AttributeName: createdAt
          KeyType: RANGE # Sort Key (Clave de Ordenación)
          
      # 4. Modo de Facturación (Correcto, no requiere ProvisionedThroughput)
      BillingMode: PAY_PER_REQUEST

functions:
  get-comments:
    handler: dist/user/infrastructure/driving/handlers/http/GetCommentsHttp.handler
    role: GetCommentsRole
    timeout: 29
    memorySize: 128
    description: Get comments from the database
    environment:
      STAGE: ${opt:stage}
      REGION: ${opt:region}
      COMMENTS_TABLE_NAME: wedding-page-api-comments-table-${opt:stage}
    events:
      - http:
          path: /api/v1/comments
          method: get

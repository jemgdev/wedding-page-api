service: wedding-page-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region}
  environment:
    STAGE: ${opt:stage}
    REGION: ${opt:region}

package:
  individually: false
  patterns:
    - dist/**
    - node_modules/**
    - package.json
    - '!.github/**'
    - '!src/**'
    - '!test/**'
    - '!.git/**'
    - '!*.md'
    - '!.vscode/**'
    - '!tsconfig.json'
    - '!jest.config.js'
    - '!LICENSE'

plugins:
  - serverless-offline
  # ELIMINADO: serverless-webpack

custom:
  # CONFIGURACIÓN NATIVA DE ESBUILD PARA RESOLVER ALIAS DE TYPESCRIPT
  build:
    esbuild: true # Habilita ESBuild (o simplemente usa la configuración build)
    alias:
      '@user': './src/user'    # Mapea alias a la carpeta fuente
      '@shared': './src/shared' # Mapea alias a la carpeta fuente
    
  # ELIMINADO: webpack: ...
    
resources:
  Resources:
    GetCommentsRole:
      Type: AWS::IAM:Role
      Properties:
        RoleName: get-comments-role-${opt:stage}
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: get-comments-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt CommentsDynamoDBTable.Arn

    CommentsDynamoDBTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: wedding-page-api-comments-table-${opt:stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S 
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

functions:
  get-comments:
    # IMPORTANTE: El handler debe apuntar a la ubicación donde ESBuild colocará el código.
    handler: dist/user/infrastructure/driving/handlers/http/GetCommentsHttp.handler
    role: GetCommentsRole
    timeout: 29
    memorySize: 128
    description: Get comments from the database
    environment:
      STAGE: ${opt:stage}
      REGION: ${opt:region}
      COMMENTS_TABLE_NAME: wedding-page-api-comments-table-${opt:stage}
    events:
      - http:
          path: /api/v1/comments
          method: get
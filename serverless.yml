service: wedding-page-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region}
  environment:
    STAGE: ${opt:stage}
    REGION: ${opt:region}

package:
  individually: false # Se mantiene false, pero Webpack podría manejar esto.
  patterns:
    - dist/**
    - node_modules/**
    - package.json
    - '!.github/**'
    - '!src/**'
    - '!test/**'
    - '!.git/**'
    - '!*.md'
    - '!.vscode/**'
    - '!tsconfig.json'
    - '!jest.config.js'
    - '!LICENSE'

plugins:
  - serverless-offline
  - serverless-webpack # NUEVO: Plugin de Webpack

custom: # NUEVO: Configuración de Webpack para Serverless
  webpack:
    webpackConfig: 'webpack.config.js' # Archivo de configuración
    includeModules: true # Incluye node_modules necesarios
    packager: 'npm'
    
resources:
  Resources:
    GetCommentsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: get-comments-role-${opt:stage}
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: get-comments-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    # CORRECCIÓN: Usamos !GetAtt para referenciar el ARN de la tabla.
                    # Esto garantiza que el ARN se construye correctamente en tiempo de despliegue.
                    - !GetAtt CommentsDynamoDBTable.Arn

    CommentsDynamoDBTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: wedding-page-api-comments-table-${opt:stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S 
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

functions:
  get-comments:
    handler: dist/user/infrastructure/driving/handlers/http/GetCommentsHttp.handler
    role: GetCommentsRole
    timeout: 29
    memorySize: 128
    description: Get comments from the database
    environment:
      STAGE: ${opt:stage}
      REGION: ${opt:region}
      COMMENTS_TABLE_NAME: wedding-page-api-comments-table-${opt:stage}
    events:
      - http:
          path: /api/v1/comments
          method: get
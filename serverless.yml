service: wedding-page-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region}
  environment:
    STAGE: ${opt:stage}
    REGION: ${opt:region}

custom:
  # CONFIGURACIÓN NATIVA DE ESBUILD PARA RESOLVER ALIAS DE TYPESCRIPT
  build:
    esbuild: true # Habilita ESBuild
    platform: node # Asegura que el target sea Node.js
    alias:
      '@comment': './src/comment'    # Mapea alias a la carpeta fuente
      '@shared': './src/shared' # Mapea alias a la carpeta fuente
    
  # ELIMINADO: webpack: ...
    
resources:
  Resources:
    GetCommentsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: get-comments-role-${opt:stage}
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: get-comments-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - dynamodb:Scan
                  Resource:
                    - !GetAtt CommentsDynamoDBTable.Arn

    CreateCommentRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: create-comment-role-${opt:stage}
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: create-comment-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                  Resource:
                    - !GetAtt CommentsDynamoDBTable.Arn

    CommentsDynamoDBTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: wedding-page-api-comments-table-${opt:stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S 
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

functions:
  get-comments:
    # CORRECCIÓN CRÍTICA: Apunta al archivo fuente original (TS/ESM)
    # Asegúrate de que este archivo exista en src/
    handler: src/comment/infrastructure/driving/handlers/http/GetCommentsHttp.handler
    role: GetCommentsRole
    timeout: 29
    memorySize: 128
    description: Get comments from the database
    environment:
      STAGE: ${opt:stage}
      REGION: ${opt:region}
      COMMENTS_TABLE_NAME: wedding-page-api-comments-table-${opt:stage}
      LOGIFLY_BASE_URL: ${param:logifly_base_url}
      LOGIFLY_EMAIL: ${param:logifly_email}
      LOGIFLY_PASSWORD: ${param:logifly_password}
    events:
      - http:
          path: /api/v1/comments
          method: get
  
  create-comment:
    # CORRECCIÓN CRÍTICA: Apunta al archivo fuente original (TS/ESM)
    # Asegúrate de que este archivo exista en src/
    handler: src/comment/infrastructure/driving/handlers/http/CreateCommentHttp.handler
    role: CreateCommentRole
    timeout: 29
    memorySize: 128
    description: Create comments in the database
    environment:
      STAGE: ${opt:stage}
      REGION: ${opt:region}
      COMMENTS_TABLE_NAME: wedding-page-api-comments-table-${opt:stage}
    events:
      - http:
          path: /api/v1/comments
          method: post